info:
  name: Delete Experience
  type: http
  seq: 16

http:
  method: POST
  url: "{{40}}/api/ssh/database/mutate-and-generate"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "targetServerId": "pod 30",
        "sql": "UPDATE detail_experience SET deleted_at = NOW() WHERE sound_scape = 101; UPDATE experiences SET deleted_at = NOW() WHERE menu_name = 'Forest Healing';",
        "createBackup": true,
        "regenerate": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
