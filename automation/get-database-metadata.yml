info:
  name: Get Database Live Metadata
  type: http
  seq: 9

http:
  method: GET
  url: "{{40}}/api/ssh/database/metadata?target=pod 30&category=all&includeRaw=true"
  params:
    - name: target
      value: pod 30
      type: query
    - name: category
      value: all
      type: query
    - name: includeRaw
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
