info:
  name: Update Self Development
  type: http
  seq: 3

http:
  method: POST
  url: "{{40}}/api/ssh/database/mutate-and-generate"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "targetServerId": "pod 30",
        "sql": "UPDATE self_development_sound SET title = 'Alpha Wave Focus 10Hz', description = 'Musik binaural beats untuk stimulasi gelombang otak alpha', duration = 1200, filepath = 'alpha_focus_10hz.mp3', video = 'focus_ambient.mp4', lamp = 'strobe_calm.txt' WHERE sound_code = 1;",
        "createBackup": true,
        "regenerate": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
