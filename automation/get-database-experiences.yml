info:
  name: Get Experiences (Database)
  type: http
  seq: 10

http:
  method: GET
  url: "{{40}}/api/ssh/database/experiences?target=pod 30&includeRaw=true"
  params:
    - name: target
      value: pod 30
      type: query
    - name: includeRaw
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
