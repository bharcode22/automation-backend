info:
  name: Update Experience
  type: http
  seq: 2

http:
  method: POST
  url: "{{local_url}}/api/ssh/database/mutate-and-generate"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "targetServerId": "pod 30",
        "sql": "UPDATE experiences SET information = 'Sesi relaksasi suara ombak laut malam' WHERE menu_name = 'Ocean Waves'; UPDATE detail_experience SET song = 'ocean_waves.mp3', lamp = 'strobe_blue.txt', scent = '1', duration = 30 WHERE sound_scape = 1; UPDATE burst_time SET start_time = 15, duration = 5 WHERE fk_detail_experience = 1;",
        "createBackup": true,
        "regenerate": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
